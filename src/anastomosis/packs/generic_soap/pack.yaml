name: generic_soap
display: "Generic SOAP"
version: "1.0"
description: >
  Vendor-neutral SOAP/visit-note pack. Renders any canonical encounter into
  a clean, archival chart note: header (facility / patient / visit), note
  sections, vitals table, addenda, and signature line.
locale: en_US
timezone: America/New_York
page:
  size: Letter
  margin_top: 0.6in
  margin_right: 0.6in
  margin_bottom: 0.6in
  margin_left: 0.6in
filename:
  pattern: "{family}_{given}_{dos}.pdf"
  collision: guid_suffix
sections:
  vitals:
    label: Vitals
    default: true
  addenda:
    label: Addenda
    default: true
  insurance:
    label: Insurance / payment information
    default: false
    description: Coverage details on the note footer
  social_history:
    label: Social history
    default: false
tokens:
  heading_fill: "#f1f1f1"
  body_font: "Georgia, 'Times New Roman', serif"

verify_header_fields: [patient_name, dob, dos]

# What this layout carries out of the record, and what it does not — QA reads
# both halves so it can tell a chart that LOST the problem list from a layout
# that never had one. A visit note is a note about one visit; the standing
# lists belong to a chart summary, and this pack does not render one. None of
# this is lost data: the same facts go to the destination in the structured
# C-CDA payload, sit beside the PDFs in the archive's bundle.json, and are
# rendered for a reader in the whole-patient record summary every run writes
# into `record-summary/`. What they do not do is appear on this page, and QA
# now says so with a count instead of grading the omission clean.
coverage:
  omits:
    conditions: >
      a visit note states this encounter's assessment in the note body; the
      standing problem list belongs to a chart summary this pack does not render
    allergies: >
      no allergy block in a SOAP note layout — allergies are a chart-level list
    medications: >
      no medication list in a SOAP note layout; today's prescribing is prose in
      the Plan section
    immunizations: >
      no immunization table in a SOAP note layout
    results: >
      the vitals table carries what was measured at this visit; laboratory
      results are a separate report and this layout has no section for them
