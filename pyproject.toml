[build-system]
# >=1.27 is the floor for PEP 639 support: earlier hatchling parses
# `license-files` only in its legacy table form and silently ignores the LIST
# form below, producing a wheel with no dist-info/licenses/ at all. The release
# workflow greps the built wheel for the Apache-2.0 and OFL-1.1 headings, but a
# floor that admits a backend which cannot honour the config is a gap the grep
# only catches after the fact.
#
# <1.30 is the CEILING, and it is empirical, not cosmetic: the core-metadata
# version a hatchling release emits has oscillated, and still does. Measured on
# this project 2026-08-21 and RE-MEASURED 2026-08-31 against a Dependabot
# proposal of >=1.32.0,<1.33, by reading DEFAULT_METADATA_VERSION out of each
# installed release, and checked against pypa/hatch's own release history on
# 2026-09-03:
#
#     1.27.0 -> 2.4    1.29.0 -> 2.4    1.30.1 -> 2.4    1.31.0 -> 2.4
#     1.30.0 -> 2.5    1.32.0 -> 2.5
#
# 1.30.0 has since been YANKED upstream and 1.30.1 reverted it, which is
# independent corroboration that the 2.5 releases are the anomaly rather than
# the direction of travel. The oscillation is why this is a range and not a
# floor: `<1.32` would be tempting because 1.31 is good, and it would admit
# 1.30.0, which is not.
#
# What refuses 2.5 is this repository's OWN gate: release.yml reads
# Metadata-Version out of the built wheel and admits 2.1 through 2.4 only, so
# a backend emitting 2.5 fails the build step rather than the irreversible
# upload. It was twine's refusal too, once — "'2.5' is not a valid metadata
# version" is what failed the real publish of 0.7.0 at the upload step — but
# the pinned pypa/gh-action-pypi-publish has since bundled a twine that
# accepts 2.5, so the ceiling is a line this repository keeps, not one PyPI
# imposes. 2.4 is what every publish path accepts, and it carries PEP 639
# license-files exactly the same way. Raising this bound means re-measuring
# AND raising the workflow's gate with it; the two must agree, and
# tests/unit/test_workflow_supply_chain.py reads the bound so a bump that
# admits a 2.5 release fails CI before a tag is spent.
requires = ["hatchling>=1.32.0,<1.33"]
build-backend = "hatchling.build"

[project]
name = "anastomosis"
description = "Lossless medical-records migration between electronic healthcare systems - platform-agnostic and physician-friendly."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# The wheel must CARRY the third-party license texts it redistributes (the
# HL7 CDA stylesheet is Apache-2.0; the two GUI fonts are OFL-1.1): PEP 639
# license-files places every entry under <dist>.dist-info/licenses/. The
# release workflow greps the built wheel for both headings and fails if
# either is missing.
license-files = [
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
  "assets/licenses/APACHE-2.0.txt",
  "assets/licenses/OFL-1.1.txt",
]
authors = [{ name = "Azal Daniel" }]
keywords = [
  "ehr",
  "ehi-export",
  "healthcare",
  "interoperability",
  "fhir",
  "ccda",
  "medical-records",
  "migration",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.13.4",
  "jinja2>=3.1.6",
  "typer>=0.27.1",
  "rich>=15.0.0",
  "lxml>=6.1.2",
  "pyyaml>=6.0.3",
  # Deterministic column-name similarity for learning a new source format from
  # an example (anast source init). ~1 MB, no transitive deps; lazy-imported.
  "rapidfuzz>=3.14.5",
  # Windows has no system tz database; zoneinfo needs the PyPI one there.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Rendering + QA. PyMuPDF is AGPL-3.0 — license-aligned with this project.
# The playwright floor stays open for library users; builds pin it exactly via
# packaging/constraints.txt so goldens and bundled Chromium cannot drift.
render = ["playwright>=1.46", "pymupdf>=1.28.2"]
# FHIR canonical-model import/export (fhir.resources is pydantic-v2 based).
fhir = ["fhir.resources>=8.3.0"]
# Browser-automation delivery (destination packs).
deliver-browser = ["playwright>=1.46"]
# Desktop GUI.
# Lower bound 6.2: pywebview 6.2.1 fails to import from a Nuitka-frozen
# Windows build (upstream issue #1817) and 6.2 is the last known good; the
# package build additionally pins ==6.2 via packaging/constraints.txt. <7.0
# bounds the major so a future breaking release is a deliberate bump here.
gui = ["pywebview>=6.2,<7.0"]
dev = [
  "anastomosis[render,fhir,deliver-browser]",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-socket>=0.8.1",
  "hypothesis>=6.165.10",
  "ruff>=0.16.5",
  "mypy>=2.3.1",
  # The complexity ratchet (tools/complexity_gate.py) reads radon's JSON;
  # xenon rides along for humans who want the threshold view directly.
  "radon>=6.0.1,<7.0",
  "xenon>=0.9.3,<1.0",
  "types-PyYAML",
  "lxml-stubs",
  "pre-commit>=4.6.2",
]

[project.scripts]
anast = "anastomosis.cli:app"
anastomosis = "anastomosis.cli:app"

[project.gui-scripts]
# The desktop GUI launcher (windowed; the packaged app's Start-menu target).
anastomosis-gui = "anastomosis.gui.__main__:main"

[project.urls]
Homepage = "https://github.com/AzalDaniel/Anastomosis"
Issues = "https://github.com/AzalDaniel/Anastomosis/issues"

[tool.hatch.version]
path = "src/anastomosis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anastomosis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# Vendored third-party material (its own license, upstream's style) is not
# ours to lint — same rule the review-archaeology guard applies to `vendor`
# path components.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # bandit security rules
  "C4",  # comprehensions
  "DTZ", # naive-datetime traps (PHI timestamps must be tz-aware)
  "RUF",
]
ignore = [
  "S101", # assert is fine in this codebase (tests + invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
# RUF012 misfires on pydantic models: pydantic v2 deep-copies mutable defaults
# per-instance, so `field: list[X] = []` is safe and idiomatic there.
"src/anastomosis/core/model/*" = ["RUF012"]
# HTML templates: wrapping a `<li>` across lines would change the rendered
# markup. Templates stay as the natural string literals; only this file is
# allowed to exceed the 100-column limit.
"src/anastomosis/deliver/archive/templates.py" = ["E501"]
# The draft-pack emitter generates a Jinja2 template.html as a string literal
# that mirrors packs/generic_soap/template.html verbatim; wrapping its long
# markup lines would change the emitted output, so E501 is relaxed here too
# (same rationale as the archive templates above).
"src/anastomosis/packgen/emit.py" = ["E501"]

[tool.pytest.ini_options]
# The default lanes, listed explicitly. tests/gui_e2e is NOT here on purpose:
# it drives the packaged GUI pages in headless Chromium and is run by its own
# lane (`pytest tests/gui_e2e -m gui_e2e`), the same way the FHIR integration
# lane is scoped by path — so the default `pytest` (and tools/check.sh) never
# needs a browser for it.
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
# The repo root, so a test can import `tools.*` — the release scripts are not
# part of the shipped package and are not installed. `python -m pytest` puts the
# working directory on sys.path and a bare `pytest` does not, which is exactly
# how a green local gate and a red CI run disagreed about `tools.sbom`.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "e2e: end-to-end pipeline tests (need playwright chromium)",
  "gui_e2e: GUI behaviour tests driving the bundled pages in headless Chromium",
  "fhir_integration: live FHIR-server tests (need ANAST_FHIR_BASE_URL; CI service container)",
]

[tool.mypy]
python_version = "3.11"
packages = ["anastomosis"]
mypy_path = "src"
strict = true
# New code is written strict from day one; ports tighten incrementally.
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional extras: typed when installed, but their absence (minimal installs)
# must not fail type-checking of the core package. pymupdf's typing is
# partial; webview (pywebview) is the optional gui extra.
module = ["playwright.*", "pymupdf", "pymupdf.*", "webview", "webview.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/anastomosis"]
