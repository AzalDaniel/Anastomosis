[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "anastomosis"
description = "Reconstruct, verify, and re-home clinical records. An open-source toolkit for EHR migration, archival, and record liberation."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
# The wheel must CARRY the third-party license texts it redistributes (the
# HL7 CDA stylesheet is Apache-2.0; the two GUI fonts are OFL-1.1): PEP 639
# license-files places every entry under <dist>.dist-info/licenses/. The
# release workflow greps the built wheel for both headings and fails if
# either is missing.
license-files = [
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
  "assets/licenses/APACHE-2.0.txt",
  "assets/licenses/OFL-1.1.txt",
]
authors = [{ name = "Azal Daniel" }]
keywords = [
  "ehr",
  "ehi-export",
  "healthcare",
  "interoperability",
  "fhir",
  "ccda",
  "medical-records",
  "migration",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["version"]
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "lxml>=5.2",
  "pyyaml>=6.0",
  # Deterministic column-name similarity for learning a new source format from
  # an example (anast source init). ~1 MB, no transitive deps; lazy-imported.
  "rapidfuzz>=3.9",
  # Windows has no system tz database; zoneinfo needs the PyPI one there.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Rendering + QA. PyMuPDF is AGPL-3.0 — license-aligned with this project.
# The playwright floor stays open for library users; builds pin it exactly via
# packaging/constraints.txt so goldens and bundled Chromium cannot drift.
render = ["playwright>=1.46", "pymupdf>=1.24"]
# FHIR canonical-model import/export (fhir.resources is pydantic-v2 based).
fhir = ["fhir.resources>=8.1"]
# Browser-automation delivery (destination packs).
deliver-browser = ["playwright>=1.46"]
# Desktop GUI.
# Lower bound 6.2: pywebview 6.2.1 fails to import from a Nuitka-frozen
# Windows build (upstream issue #1817) and 6.2 is the last known good; the
# package build additionally pins ==6.2 via packaging/constraints.txt. <7.0
# bounds the major so a future breaking release is a deliberate bump here.
gui = ["pywebview>=6.2,<7.0"]
dev = [
  "anastomosis[render,fhir,deliver-browser]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "hypothesis>=6.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "lxml-stubs",
  "pre-commit>=3.7",
]

[project.scripts]
anast = "anastomosis.cli:app"
anastomosis = "anastomosis.cli:app"

[project.gui-scripts]
# The desktop GUI launcher (windowed; the packaged app's Start-menu target).
anastomosis-gui = "anastomosis.gui.__main__:main"

[project.urls]
Homepage = "https://github.com/AzalDaniel/Anastomosis"
Issues = "https://github.com/AzalDaniel/Anastomosis/issues"

[tool.hatch.version]
path = "src/anastomosis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anastomosis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# Vendored third-party material (its own license, upstream's style) is not
# ours to lint — same rule the review-archaeology guard applies to `vendor`
# path components.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "S",   # bandit security rules
  "C4",  # comprehensions
  "DTZ", # naive-datetime traps (PHI timestamps must be tz-aware)
  "RUF",
]
ignore = [
  "S101", # assert is fine in this codebase (tests + invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
# RUF012 misfires on pydantic models: pydantic v2 deep-copies mutable defaults
# per-instance, so `field: list[X] = []` is safe and idiomatic there.
"src/anastomosis/core/model/*" = ["RUF012"]
# HTML templates: wrapping a `<li>` across lines would change the rendered
# markup. Templates stay as the natural string literals; only this file is
# allowed to exceed the 100-column limit.
"src/anastomosis/deliver/archive/templates.py" = ["E501"]
# The draft-pack emitter generates a Jinja2 template.html as a string literal
# that mirrors packs/generic_soap/template.html verbatim; wrapping its long
# markup lines would change the emitted output, so E501 is relaxed here too
# (same rationale as the archive templates above).
"src/anastomosis/packgen/emit.py" = ["E501"]

[tool.pytest.ini_options]
# The default lanes, listed explicitly. tests/gui_e2e is NOT here on purpose:
# it drives the packaged GUI pages in headless Chromium and is run by its own
# lane (`pytest tests/gui_e2e -m gui_e2e`), the same way the FHIR integration
# lane is scoped by path — so the default `pytest` (and tools/check.sh) never
# needs a browser for it.
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
addopts = "-q --strict-markers"
markers = [
  "e2e: end-to-end pipeline tests (need playwright chromium)",
  "gui_e2e: GUI behaviour tests driving the bundled pages in headless Chromium",
  "fhir_integration: live FHIR-server tests (need ANAST_FHIR_BASE_URL; CI service container)",
]

[tool.mypy]
python_version = "3.11"
packages = ["anastomosis"]
mypy_path = "src"
strict = true
# New code is written strict from day one; ports tighten incrementally.
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional extras: typed when installed, but their absence (minimal installs)
# must not fail type-checking of the core package. pymupdf's typing is
# partial; webview (pywebview) is the optional gui extra.
module = ["playwright.*", "pymupdf", "pymupdf.*", "webview", "webview.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/anastomosis"]
