# CodeQL configuration for Anastomosis.
#
# Full-tree scan: no `paths` / `paths-ignore` (every module is analyzed) and no
# `query-filters` (no rule is excluded repo-wide). Anastomosis's product surface
# is writing patient records to disk, which the clear-text storage/logging rules
# cannot distinguish from a defect; rather than silence any rule everywhere, each
# deliberate PHI-writing call site carries an inline `# codeql[...]` suppression
# next to a PHI-BY-DESIGN rationale. That per-site policy, and the exact audited
# sites, are governed by the "Code scanning & suppression policy (auditable)"
# section of SECURITY.md.
#
# Inline `# codeql[query-id]` suppression takes TWO things, and for a long time
# this file claimed it took one. `AlertSuppression.ql` does ship inside every
# standard query pack, `security-extended` included, and it does compute the
# suppression into the uploaded SARIF. Code scanning then ignores it: the alert
# stays open and a pull request touching that line still fails. The dismissal
# step at the end of .github/workflows/codeql.yml is the second thing — it reads
# the SARIF's `suppressions[]` property back and dismisses the matching alerts
# through the API. Without that step every comment below is decoration.
name: Anastomosis CodeQL config

queries:
  - uses: security-extended
