name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Least-privilege default for every job.
permissions:
  contents: read

jobs:
  phi-scan:
    name: PHI scan (full tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python tools/phi_scan.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff radon
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/complexity_gate.py

  # mypy lane — tools/check.sh claims "exactly what CI runs" and lists mypy
  # as one of the gates; this lane closes the drift where mypy is a local
  # gate with no CI lane. The dev extra brings mypy + type stubs and pulls in
  # render+fhir so the optional-extra imports type-resolve cleanly under
  # --strict. The gui extra is REQUIRED too: without pywebview installed the
  # mypy override silently masks GUI typing (that gap hid a real
  # Window|None deref in gui/shell.py that only the documented .[dev,gui]
  # environment caught). Constraints keep the resolved versions identical to
  # the package build's.
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev,gui]" -c packaging/constraints.txt
      - run: python -m mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
      # pymupdf: the QA stage is core pipeline behavior and must be tested on
      # every OS/Python combo (Chromium itself stays in the e2e lane).
      # fhir.resources: the FHIR bundle schema-validation test must run here.
      # radon: the complexity gate's live self-test runs the real gate, and
      # the gate shells out to radon — absent, the self-test fails on every leg.
      - run: pip install -e . pytest pytest-socket hypothesis pymupdf radon "fhir.resources>=8.1"
      - run: pytest -m "not e2e and not slow"

  # Separate lane: installs the rendering stack (Playwright Chromium) and runs
  # full-pipeline tests. Activates from milestone M1 onward; passes trivially
  # while no e2e tests exist.
  e2e:
    name: End-to-end (pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      # playwright is PINNED via packaging/constraints.txt to the version the
      # rendering goldens were generated with (tests/e2e/goldens/*.json carries
      # the exact browser in _meta) — golden text layers are only stable under
      # the same Chromium build. Bump the pin THERE and regenerate goldens
      # TOGETHER (python tools/regen_goldens.py), reviewed via the JSON diff.
      # pytest-socket: the e2e lane still COLLECTS tests/unit (then deselects),
      # which imports tests/unit/conftest.py's network guard.
      - run: pip install -e ".[render,fhir]" -c packaging/constraints.txt pytest pytest-socket hypothesis
      - run: playwright install chromium --with-deps
      # The gate preflight (tools/check.sh runs it first): proves in CI that
      # a playwright-installed environment with the browser present passes,
      # keeping the check.sh <-> ci.yml parity contract whole.
      - run: python tools/preflight.py
      - run: pytest -m e2e

  gui-e2e:
    name: GUI behaviour (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      # Drives the bundled GUI pages (file:// + a generated pywebview-bridge
      # stub) in headless Chromium — the Linux proxy for the real WebView2
      # window. The Windows package job's smoke test asserts the SAME
      # expectations module against the shipped window, so a selector cannot
      # rot there without going red here first. Chromium is pinned via
      # packaging/constraints.txt like every rendering lane.
      - run: pip install -e ".[render]" -c packaging/constraints.txt pytest pytest-socket hypothesis
      - run: playwright install chromium --with-deps
      - run: pytest tests/gui_e2e -m gui_e2e

  # Separate lane: stands up a live HAPI FHIR R4 server as a service container
  # and runs the fhir_api destination against it. The fhir_integration tests
  # skipif ANAST_FHIR_BASE_URL is unset, so they are inert in every other lane.
  fhir-integration:
    name: FHIR integration (HAPI)
    runs-on: ubuntu-latest
    services:
      hapi:
        image: hapiproject/hapi:v8.0.0
        ports:
          - 8080:8080
    env:
      ANAST_FHIR_BASE_URL: http://127.0.0.1:8080/fhir
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      # pymupdf: importing anastomosis.deliver (the engine's parent package)
      # eagerly loads the QA stage, which needs PyMuPDF at import time.
      - run: pip install -e ".[fhir]" pymupdf pytest
      # Wait (loud) for HAPI to answer its CapabilityStatement before testing.
      - name: Wait for HAPI to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$ANAST_FHIR_BASE_URL/metadata" >/dev/null; then
              echo "HAPI is ready"
              exit 0
            fi
            echo "waiting for HAPI ($i)…"
            sleep 2
          done
          echo "HAPI did not become ready within 120s" >&2
          exit 1
      # Collection is scoped to tests/integration: a bare `-m` filter still
      # IMPORTS every unit module first, and several need PyMuPDF, which this
      # lane deliberately does not install.
      - run: pytest tests/integration -m fhir_integration
