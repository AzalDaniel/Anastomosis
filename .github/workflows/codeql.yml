# CodeQL — advanced security scanning for Anastomosis.
#
# Activation note (one-time, by a repository admin): GitHub rejects
# advanced-setup SARIF uploads while code-scanning DEFAULT setup is enabled, so
# this workflow's results only land once default setup is turned off under
# Settings -> Code security -> CodeQL analysis (default setup). Do that once and
# the pushes/PRs/schedule below start uploading results.
#
# The scan runs the security-extended suite over the FULL tree with no repo-wide
# rule exclusions; deliberate PHI-writing call sites carry inline per-site
# suppressions instead. The query selection lives in
# ./.github/codeql/codeql-config.yml and the suppression policy is governed by
# the "Code scanning & suppression policy (auditable)" section of SECURITY.md.
name: CodeQL

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    # Weekly, at a quiet UTC hour (Monday 03:23 UTC).
    - cron: "23 3 * * 1"

# Least-privilege default for every job (mirrors ci.yml).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # checkout needs contents: read; SARIF upload needs security-events: write.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # init and analyze are two halves of one release: the CodeQL Action
      # rejects a run where they disagree, so they carry the same SHA/version
      # on purpose (test_codeql_policy.py pins that the two never drift).
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
