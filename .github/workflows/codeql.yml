# CodeQL — advanced security scanning for Anastomosis.
#
# Activation note (one-time, by a repository admin): GitHub rejects
# advanced-setup SARIF uploads while code-scanning DEFAULT setup is enabled, so
# this workflow's results only land once default setup is turned off under
# Settings -> Code security -> CodeQL analysis (default setup). Do that once and
# the pushes/PRs/schedule below start uploading results.
#
# The scan runs the security-extended suite over the FULL tree with no repo-wide
# rule exclusions; deliberate PHI-writing call sites carry inline per-site
# suppressions instead. The query selection lives in
# ./.github/codeql/codeql-config.yml and the suppression policy is governed by
# the "Code scanning & suppression policy (auditable)" section of SECURITY.md.
#
# An inline `# codeql[...]` suppression takes THREE things, and this file has
# twice claimed it took fewer. One: the suppression query must actually run,
# which is the `packs:` line on init below — the suite ships the query but does
# not run it, and without it the SARIF carries no `suppressions[]` property at
# all. Two: code scanning ignores that property even when present. Three: the
# dismissal step reads it back and dismisses the matching alerts through the
# API. Miss any one and every suppression comment in this repository is
# decoration. Each was found by watching the control fail rather than by
# reading about it: #310's correctly-formed comment did not clear its alert,
# and after the dismissal step landed it still did not — the step reported
# success while dismissing nothing.
name: CodeQL

on:
  # `push` is main-only ON PURPOSE. Every branch here opens a pull request, and
  # `pull_request` already covers it — listing `claude/**` here as well ran the
  # whole matrix TWICE per commit, against the same SHA, for no extra signal.
  # Measured on PR #331: run 33355245691 and run 33355224110, same commit, both
  # green, 24 check runs where 12 say the same thing. The duplicates are not
  # free: every check run is a webhook and a row that anything watching the PR
  # then reads back, and this account's GitHub write quota is shared across all
  # sessions and repositories.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, at a quiet UTC hour (Monday 03:23 UTC).
    - cron: "23 3 * * 1"

# Least-privilege default for every job (mirrors ci.yml).
# One run per head and per event: a newer push to the same branch or PR
# supersedes the run already going — the superseded commit's verdict answers a
# question nobody is still asking. Grouped by workflow+event+ref so a PR's run
# and main's run of the same workflow never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # checkout needs contents: read; SARIF upload needs security-events: write.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # init and analyze are two halves of one release: the CodeQL Action
      # rejects a run where they disagree, so they carry the same SHA/version
      # on purpose (test_codeql_policy.py pins that the two never drift).
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
          # The dismissal step below is inert without this. `security-extended`
          # ships AlertSuppression.ql but does not RUN it: the CodeQL CLI only
          # computes the SARIF's `suppressions[]` property when the suppression
          # query is asked for as a pack, and that property is the only thing
          # the dismissal step can match an alert against. Merging #310 proved
          # it the expensive way — the step ran green, indexed nine alerts and
          # dismissed none, because the SARIF it read carried no suppressions.
          # It sits on `init` rather than in the config file because that is
          # the form the action's own documentation shows working, and this
          # mechanism has already been wrong twice on plausible reasoning.
          packs: codeql/python-queries:AlertSuppression.ql
      # `output` writes the SARIF to disk as well as uploading it; the dismissal
      # step reads that copy, and `id` is what lets it name the upload it
      # belongs to. One language, so the file is python.sarif.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        id: analyze
        with:
          output: sarif-results

      # Turn the inline `# codeql[rule-id]` comments into actual dismissals.
      # Alert state is repository state: only an accepted push to main may
      # mutate it. Pull requests, feature-branch pushes, and scheduled scans
      # still upload SARIF, but they can never dismiss an alert.
      - name: Dismiss suppressed alerts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/python.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
