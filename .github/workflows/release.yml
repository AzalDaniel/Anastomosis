# PyPI release via Trusted Publishing (OIDC) — on a version tag push (v*), or a
# manual dispatch which publishes the CURRENT main version to PyPI. Trusted
# Publishing binds to this workflow file + the "pypi" environment, not to the
# trigger event, so a dispatch is as trusted as a tag push (and is the way to
# release when a GITHUB_TOKEN-created tag did not cascade-trigger this workflow).
#
# No tokens or secrets: pypi.org must be configured with this repo as a
# trusted publisher (pypi.org → account → Publishing → add pending
# publisher: project "anastomosis", owner "AzalDaniel", repository
# "Anastomosis", workflow "release.yml", environment "pypi"), and a GitHub
# environment named "pypi" must exist (Settings → Environments).
#
# Supply-chain posture (security backlog: "Trusted Publishing + Sigstore"):
# - PEP 740 publish attestations: generated and uploaded by
#   pypa/gh-action-pypi-publish automatically (default since its v1.11.0).
# - SLSA build provenance: attested in the build job via
#   actions/attest-build-provenance and stored with the repo.
# - Build and publish are separate jobs (PyPA guidance): the publish job
#   never runs project code, only uploads the artifact it downloads.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing for the provenance attestation
      attestations: write # persist the attestation to GitHub
    steps:
      - name: Refuse a non-main dispatch
        # Trusted Publishing binds to this workflow file + the "pypi" environment,
        # not to the trigger event, so a manual dispatch must run from main (the
        # release-bearing ref) — a dispatch from any other ref fails here.
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        # Ref names reach the shell as ENVIRONMENT values, never as `${{ }}`
        # interpolated into the script: git permits `"`, `;`, `$`, and backticks
        # in a ref name and the `v*` filter accepts them, so an interpolated ref
        # is shell injection inside a job that holds id-token: write.
        env:
          REF: ${{ github.ref }}
        run: |
          echo "refusing to publish from '$REF': dispatch publishes are main-only" >&2
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Assert the tag names the version this source builds
        # Every `v*` tag reaches this job, and PyPI publishes whatever version
        # the SOURCE carries — so a mistyped or stale tag would mint a release
        # whose tag, artifacts, and PyPI index disagree. Same invariant the
        # Windows release path enforces (windows-package.yml, "Assert the
        # release source"): a tag run proceeds only when the tag equals
        # `v<package version>`. Dispatch runs are main-only (guarded above)
        # and publish main's version by design.
        shell: bash
        # Same rule as the dispatch guard above: the tag name is attacker-
        # shaped text, so it arrives as an environment value and is only ever
        # referenced quoted ("$REF_NAME"). The comparison logic is unchanged.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/anastomosis/__init__.py)"
          if [ -z "$version" ]; then
            echo "could not read __version__ from src/anastomosis/__init__.py" >&2
            exit 1
          fi
          expected="v${version}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dispatch publish from main: version '$version'"
          elif [ "$REF_NAME" != "$expected" ]; then
            echo "tag '$REF_NAME' does not match package version '$expected'" >&2
            exit 1
          else
            echo "tag '$REF_NAME' matches package version '$expected'"
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Assert the wheel carries the third-party license texts
        # The wheel redistributes Apache-2.0 (HL7 CDA stylesheet) and OFL-1.1
        # (the two GUI fonts) works; PEP 639 license-files in pyproject.toml
        # places their full texts under dist-info/licenses/. A release whose
        # wheel lost them (a packaging-config regression) must fail here, not
        # ship stripped of the attributions it owes.
        shell: bash
        run: |
          wheel="$(ls dist/*.whl)"
          unzip -p "$wheel" '*/licenses/assets/licenses/APACHE-2.0.txt' | grep -q "Apache License" \
            || { echo "wheel is missing the Apache-2.0 license text" >&2; exit 1; }
          unzip -p "$wheel" '*/licenses/assets/licenses/OFL-1.1.txt' | grep -q "SIL OPEN FONT LICENSE" \
            || { echo "wheel is missing the OFL-1.1 license text" >&2; exit 1; }
          unzip -p "$wheel" '*/licenses/THIRD_PARTY_LICENSES.md' | grep -q "Third-party material" \
            || { echo "wheel is missing THIRD_PARTY_LICENSES.md" >&2; exit 1; }
          echo "wheel carries the third-party license texts"
          # The core-metadata version must be one the upload path accepts. The
          # twine inside the pinned pypa/gh-action-pypi-publish image rejects
          # Metadata-Version 2.5 ("not a valid metadata version"), and hatchling
          # has flip-flopped between 2.4 and 2.5 across releases — so a backend
          # resolved outside the pyproject bound would otherwise fail at the
          # IRREVERSIBLE upload step instead of here. 2.4 carries PEP 639
          # license-files identically.
          meta="$(unzip -p "$wheel" '*.dist-info/METADATA' | sed -n 's/^Metadata-Version: //p' | head -1)"
          case "$meta" in
            2.1|2.2|2.3|2.4) echo "wheel core metadata version $meta is publishable" ;;
            *) echo "wheel core metadata version '$meta' is not accepted by the publish path (expected <= 2.4)" >&2; exit 1 ;;
          esac
      - name: Generate the wheel's runtime SBOM (CycloneDX)
        # The dependency tree a `pip install anastomosis` actually resolves to
        # today: the wheel is installed into a clean venv and THAT environment
        # is inventoried. The tool runs from a second venv so cyclonedx-bom and
        # its own deps never pollute the inventory. Kept OUT of dist/ — the
        # publish job uploads dist/* to PyPI, which accepts only sdists/wheels.
        # tools/sbom.py owns the invocation (and the version-resolution the
        # `dynamic = ["version"]` declaration makes necessary) so this workflow
        # and the Windows one cannot drift; it fails if the emitted document
        # does not name this package at this version.
        shell: bash
        run: |
          python -m venv target && target/bin/pip install --quiet dist/*.whl
          python -m venv tool
          tool/bin/pip install --quiet -c packaging/constraints.txt cyclonedx-bom
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/anastomosis/__init__.py)"
          python tools/sbom.py --cyclonedx tool/bin/cyclonedx-py \
            --target-python target/bin/python \
            --out "sbom/anastomosis-${version}-sbom.cdx.json"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/*
            sbom/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anastomosis
    permissions:
      id-token: write # OIDC trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
