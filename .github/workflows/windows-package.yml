name: Windows package

# Builds the downloadable Windows installer: two Nuitka --mode=standalone exes
# (the windowed GUI app + the console CLI), each bundling Chromium + all data
# assets, packaged by Inno Setup. Two self-checks gate it: the frozen
# `anast doctor` runs against the built CLI exe BEFORE packaging (a mis-bundled
# asset or an un-bundled Chromium fails the build), and AFTER packaging the
# installer is installed SILENTLY and `anast doctor` runs again against the
# INSTALLED exe (a file the installer fails to lay down, or a broken install
# layout, fails the build) — so a broken package fails CI instead of shipping.
#
# On a version tag the installer is attached to the GitHub release by a separate,
# write-scoped job, so users can download and run it like a normal Windows app.
# A manual dispatch can also PUBLISH that release: main-only, with the tag
# asserted against the package version and the release action creating tag
# v<version> on this ref (set the `publish` input to opt in).
#
# Triggers: manual (validate by default, or publish via the `publish` input);
# pushes to main (or the active dev branch) that touch the app/packaging (so
# pipeline changes are validated); and version tags (release builds). Path
# filters gate branch pushes only — GitHub ignores them for tags, so a tag
# always builds and the release job runs.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release for the current package version (creates tag v<version> on this ref)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "packaging/**"
      - ".github/workflows/windows-package.yml"
      - "src/anastomosis/**"
      - "pyproject.toml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    # Expose the resolved package version so the tag-gated release job can assert
    # the pushed tag matches it without re-installing the package.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Same interpreter as the CI lint/type/e2e lanes — the shipped
          # binary freezes the stdlib this version provides.
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          # Keyed on the constraints file so a Playwright pin bump automatically
          # invalidates the cached browser (packaging/constraints.txt is the pin).
          key: ms-playwright-windows-${{ hashFiles('packaging/constraints.txt') }}
          restore-keys: ms-playwright-windows-

      - name: Cache Nuitka
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-windows-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[render,gui,deliver-browser]" -c packaging/constraints.txt nuitka

      - name: Install Chromium (bundled at build time)
        run: playwright install chromium

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import anastomosis; print(anastomosis.__version__)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build executables (Nuitka standalone)
        run: python packaging/build_windows.py

      - name: Self-check the FROZEN bundle (anast doctor)
        # The anti-assumption gate: this exits non-zero if any data asset OR the
        # bundled Chromium is not actually present in the frozen build.
        run: dist\anast\anast.exe doctor

      - name: Self-check the FROZEN GUI bundle (Anastomosis.exe --self-check)
        # The GUI bundle is the Start-menu target and carries its OWN copy of
        # every data asset + Chromium, so it must be self-checked too — the CLI
        # `anast doctor` above only proves the CLI bundle. The GUI exe is built
        # with console mode "disable" (GUI subsystem), and PowerShell's `&` does
        # NOT wait for / capture the exit code of a GUI-subsystem process (it
        # returns immediately, leaving $LASTEXITCODE empty). Start-Process -Wait
        # -PassThru reliably waits and reads .ExitCode regardless of subsystem;
        # stdout is redirected to a file so the per-check lines still show.
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\gui-selfcheck.out"
          $p = Start-Process -FilePath dist\Anastomosis\Anastomosis.exe `
            -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) {
            throw "GUI bundle self-check failed (exit $($p.ExitCode))"
          }

      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build\MicrosoftEdgeWebview2Setup.exe"
          # Supply-chain gate: trust this bootstrapper only if Windows reports a
          # VALID Authenticode signature AND the signer is Microsoft — a tampered
          # or unsigned download (e.g. a poisoned mirror) fails the build here
          # instead of being baked into the installer.
          $sig = Get-AuthenticodeSignature build\MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'invalid WebView2 bootstrapper signature'
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\anastomosis.iss

      - name: Smoke-test the installer (silent install + installed self-check)
        # The second anti-assumption gate. Install the just-built installer the
        # way a user would (silent, default Program Files location), then prove
        # the INSTALLED app is whole: the GUI + CLI exes are laid down and the
        # installed `anast doctor` passes (every bundled asset + Chromium copied
        # through the install). A UAC/elevation hang is bounded by WaitForExit.
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer was produced" }
          Write-Host "installing $($installer.Name) silently..."
          $log = "$env:RUNNER_TEMP\anastomosis-install.log"
          $p = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$log" `
            -PassThru
          if (-not $p.WaitForExit(300000)) {
            try { $p.Kill() } catch {}
            if (Test-Path $log) { Get-Content $log }
            throw "installer did not finish within 5 min (an elevation prompt may be blocking)"
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "installer exited with code $($p.ExitCode)"
          }
          $app = Join-Path $env:ProgramFiles 'Anastomosis'
          $cli = Join-Path $app 'cli\anast.exe'
          $gui = Join-Path $app 'gui\Anastomosis.exe'
          foreach ($f in @($cli, $gui)) {
            if (-not (Test-Path $f)) { throw "installed layout is missing: $f" }
            Write-Host "present: $f"
          }
          Write-Host "running the INSTALLED 'anast doctor'..."
          & $cli doctor
          if ($LASTEXITCODE -ne 0) { throw "installed 'anast doctor' failed (exit $LASTEXITCODE)" }
          Write-Host "installed self-check passed."

      - name: Upload the installer
        # !cancelled() so the installer is available for download even when the
        # smoke-test above fails — the surest way to debug a Windows-only install
        # issue is the installer itself.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anastomosis-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    # On a version tag only, attach the installer to the GitHub release so it is
    # downloadable from the Releases page (the CI artifact above is login-gated,
    # zipped, and expires). Write-scoped and isolated from the build job, which
    # stays read-only for the ordinary branch-push validation runs.
    name: Attach the installer to the GitHub release
    needs: build
    # A version tag push, OR an explicit publish dispatch. `inputs.publish` is a
    # real boolean here (the `inputs` context preserves the dispatch input type),
    # so it reads directly; `github.event_name` gates it so tag/push runs ignore
    # the (null) input.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo (for the CHANGELOG release notes)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Assert the release source (tag matches version, or dispatch from main)
        # Guard the write-scoped upload. Invariant: a publish comes only from a
        # version tag or from main via an explicit dispatch input.
        #   - Tag runs: refuse unless the tag that triggered this run equals `v` +
        #     the version the build job resolved from the package (a mistyped/
        #     stale tag fails here rather than attaching to the wrong release).
        #   - Dispatch runs: refuse unless this ref is main — the release action
        #     creates tag v<version> on it below, so publishing from any other ref
        #     would tag the wrong commit.
        shell: bash
        run: |
          expected="v${{ needs.build.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "refusing to publish from '${{ github.ref }}': dispatch publishes are main-only" >&2
              exit 1
            fi
            echo "dispatch publish from main; the release action will create tag '$expected'"
          else
            if [ "${{ github.ref_name }}" != "$expected" ]; then
              echo "tag '${{ github.ref_name }}' does not match package version '$expected'" >&2
              exit 1
            fi
            echo "tag '${{ github.ref_name }}' matches package version '$expected'"
          fi

      - name: Extract this version's CHANGELOG section as the release notes
        # Slice the `## [<version>] — <date>` section out of CHANGELOG.md (up to
        # the next `## [` header) so the GitHub release body is the curated notes.
        # generate_release_notes (below) appends GitHub's auto PR list to this.
        shell: bash
        run: |
          ver="${{ needs.build.outputs.version }}"
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "no CHANGELOG section for $ver; falling back to generated notes only" >&2
            printf 'Anastomosis %s\n' "$ver" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Download the built installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anastomosis-windows-installer
          path: installer

      - name: Attach it to the release
        # Third-party action pinned to a full commit SHA (supply-chain hardening
        # for this write-scoped job); first-party actions/* stay on major tags.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # On tag runs tag_name equals the ref name (asserted above) and the tag
          # already exists, so target_commitish is unused; on dispatch runs the
          # action creates tag v<version> at target_commitish (this run's SHA).
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installer/*.exe
          fail_on_unmatched_files: true
          # The curated CHANGELOG section, with GitHub's auto-generated "What's
          # Changed" PR list appended after it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Pre-1.0 versions are alphas by this project's own convention
          # (README/CHANGELOG framing, the Alpha trove classifier) — flag the
          # GitHub release accordingly instead of presenting it as stable.
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
