name: Windows package

# Builds the downloadable Windows installer: two Nuitka --mode=standalone exes
# (the windowed GUI app + the console CLI), each bundling Chromium + all data
# assets, packaged by Inno Setup. Two self-checks gate it: the frozen
# `anast doctor` runs against the built CLI exe BEFORE packaging (a mis-bundled
# asset or an un-bundled Chromium fails the build), and AFTER packaging the
# installer is installed SILENTLY and `anast doctor` runs again against the
# INSTALLED exe (a file the installer fails to lay down, or a broken install
# layout, fails the build) — so a broken package fails CI instead of shipping.
#
# The same build is then packed a SECOND way, as an MSIX for the Microsoft Store
# (#292). No rebuild: packaging/build_msix.py stages the dists this job already
# produced. It is deliberately unsigned — the Store re-signs what it ingests,
# which is the whole reason the artifact exists — so the .msix is a submission
# artifact, not a download; the Inno installer above stays the download.
#
# On a version tag the installer is attached to the GitHub release by a separate,
# write-scoped job, so users can download and run it like a normal Windows app.
# A manual dispatch can also PUBLISH that release: main-only, with the tag
# asserted against the package version and the release action creating tag
# v<version> on this ref (set the `publish` input to opt in).
#
# That release job also attests build provenance for the exe and its SBOM
# (actions/attest-build-provenance, same pattern as the PyPI path in
# release.yml) and labels the installer unsigned in the release notes: it has
# no Authenticode signature, so provenance ("this workflow run produced these
# bytes") is what `gh attestation verify` can check today, not publisher
# identity — signing is a separate decision the project owner makes (#282).
#
# Triggers: manual (validate by default, or publish via the `publish` input);
# pushes to main (or the active dev branch) that touch the app/packaging (so
# pipeline changes are validated); and version tags (release builds). Path
# filters gate branch pushes only — GitHub ignores them for tags, so a tag
# always builds and the release job runs.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release for the current package version (creates tag v<version> on this ref)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "packaging/**"
      - ".github/workflows/windows-package.yml"
      - "src/anastomosis/**"
      - "pyproject.toml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    # Expose the resolved package version so the tag-gated release job can assert
    # the pushed tag matches it without re-installing the package.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Same interpreter as the CI lint/type/e2e lanes — the shipped
          # binary freezes the stdlib this version provides.
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          # Keyed on the constraints file so a Playwright pin bump automatically
          # invalidates the cached browser (packaging/constraints.txt is the pin).
          key: ms-playwright-windows-${{ hashFiles('packaging/constraints.txt') }}
          restore-keys: ms-playwright-windows-

      - name: Cache Nuitka
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-windows-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[render,gui,deliver-browser]" -c packaging/constraints.txt nuitka

      - name: Install Chromium (bundled at build time)
        run: playwright install chromium

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import anastomosis; print(anastomosis.__version__)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build executables (Nuitka standalone)
        run: python packaging/build_windows.py

      - name: Self-check the FROZEN bundle (anast doctor)
        # The anti-assumption gate: this exits non-zero if any data asset OR the
        # bundled Chromium is not actually present in the frozen build.
        run: dist\anast\anast.exe doctor

      - name: Self-check the FROZEN GUI bundle (Anastomosis.exe --self-check)
        # The GUI bundle is the Start-menu target and carries its OWN copy of
        # every data asset + Chromium, so it must be self-checked too — the CLI
        # `anast doctor` above only proves the CLI bundle. The GUI exe is built
        # with console mode "disable" (GUI subsystem), and PowerShell's `&` does
        # NOT wait for / capture the exit code of a GUI-subsystem process (it
        # returns immediately, leaving $LASTEXITCODE empty). Start-Process -Wait
        # -PassThru reliably waits and reads .ExitCode regardless of subsystem;
        # stdout is redirected to a file so the per-check lines still show.
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\gui-selfcheck.out"
          $p = Start-Process -FilePath dist\Anastomosis\Anastomosis.exe `
            -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) {
            throw "GUI bundle self-check failed (exit $($p.ExitCode))"
          }

      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build\MicrosoftEdgeWebview2Setup.exe"
          # Supply-chain gate: trust this bootstrapper only if Windows reports a
          # VALID Authenticode signature AND the signer is Microsoft — a tampered
          # or unsigned download (e.g. a poisoned mirror) fails the build here
          # instead of being baked into the installer.
          $sig = Get-AuthenticodeSignature build\MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'invalid WebView2 bootstrapper signature'
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\anastomosis.iss

      - name: Smoke-test the installer (install, doctor, real window, uninstall)
        # The second anti-assumption gate, end to end the way a user meets the
        # artifact: silent install -> installed layout -> installed `anast
        # doctor` -> the dashboard actually renders inside the shipped WebView2
        # window (Playwright over CDP; DOM expectations shared with the Linux
        # gui-e2e lane) -> silent uninstall leaves no payload behind. Any FAIL
        # exits non-zero and fails the build.
        run: python packaging/smoke_windows.py

      - name: Generate the installer SBOM (CycloneDX)
        # AFTER the smoke gate, deliberately. An SBOM is a statement about
        # something that works; producing one for an installer that has not yet
        # been shown to install is a statement about nothing, and it was the
        # step order until now.
        #
        # What actually ships inside the frozen bundles is this job's Python
        # environment (Nuitka freezes it wholesale), so the SBOM is generated
        # FROM that environment — not from pyproject floors, which say what is
        # allowed, not what was shipped. Written next to the installer so the
        # release job attaches both to the GitHub release.
        # The tool runs from its own venv and inventories the BUILD interpreter,
        # so cyclonedx-bom and its deps never appear in the shipped inventory;
        # tools/sbom.py owns the invocation, shared with release.yml.
        shell: pwsh
        run: |
          $target = (python -c "import sys; print(sys.executable)")
          python -m venv "$env:RUNNER_TEMP\sbomtool"
          & "$env:RUNNER_TEMP\sbomtool\Scripts\pip.exe" install --quiet `
            -c packaging/constraints.txt cyclonedx-bom
          python tools/sbom.py `
            --cyclonedx "$env:RUNNER_TEMP\sbomtool\Scripts\cyclonedx-py.exe" `
            --target-python "$target" `
            --out "dist/installer/Anastomosis-${{ steps.ver.outputs.version }}-sbom.cdx.json"
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }

      - name: Pack the MSIX for the Microsoft Store
        # The second door onto the SAME build (#292): build_msix.py stages the
        # dist/ layout the installer just packaged, renders AppxManifest.xml.in
        # into it, and runs the Windows SDK's makeappx. Nothing is rebuilt and
        # nothing is signed — the Store re-signs what it ingests, so this
        # package needs no certificate and cannot be side-loaded.
        #
        # After the smoke gate for the same reason the SBOM is: these are the
        # bytes the installer just proved it can lay down and run. Identity is
        # left at build_msix.py's local-validation default; the Partner Center
        # pair is substituted at submission, not in CI, because it is account
        # state rather than build state.
        run: python packaging/build_msix.py --version ${{ steps.ver.outputs.version }}

      - name: Upload the installer
        # !cancelled() so the installer is available for download even when the
        # smoke-test above fails — the surest way to debug a Windows-only install
        # issue is the installer itself. The MSIX rides in the same artifact so
        # the release job downloads one thing and attaches all three.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anastomosis-windows-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.cdx.json
            dist/installer/*.msix
          if-no-files-found: error

  release:
    # On a version tag only, attach the installer to the GitHub release so it is
    # downloadable from the Releases page (the CI artifact above is login-gated,
    # zipped, and expires). Write-scoped and isolated from the build job, which
    # stays read-only for the ordinary branch-push validation runs.
    name: Attach the installer to the GitHub release
    needs: build
    # A version tag push, OR an explicit publish dispatch. `inputs.publish` is a
    # real boolean here (the `inputs` context preserves the dispatch input type),
    # so it reads directly; `github.event_name` gates it so tag/push runs ignore
    # the (null) input.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore signing for the provenance attestation (#282)
      attestations: write # persist the attestation to GitHub
    steps:
      - name: Check out the repo (for the CHANGELOG release notes)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Assert the release source (tag matches version, or dispatch from main)
        # Guard the write-scoped upload. Invariant: a publish comes only from a
        # version tag or from main via an explicit dispatch input.
        #   - Tag runs: refuse unless the tag that triggered this run equals `v` +
        #     the version the build job resolved from the package (a mistyped/
        #     stale tag fails here rather than attaching to the wrong release).
        #   - Dispatch runs: refuse unless this ref is main — the release action
        #     creates tag v<version> on it below, so publishing from any other ref
        #     would tag the wrong commit.
        shell: bash
        # Ref names reach the shell as ENVIRONMENT values, never as `${{ }}`
        # interpolated into the script: git permits `"`, `;`, `$`, and backticks
        # in a ref name and the `v*` filter accepts them, so an interpolated ref
        # is shell injection inside a job that holds contents: write. The
        # comparison logic below is unchanged.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          expected="v${VERSION}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "refusing to publish from '$REF': dispatch publishes are main-only" >&2
              exit 1
            fi
            echo "dispatch publish from main; the release action will create tag '$expected'"
          else
            if [ "$REF_NAME" != "$expected" ]; then
              echo "tag '$REF_NAME' does not match package version '$expected'" >&2
              exit 1
            fi
            echo "tag '$REF_NAME' matches package version '$expected'"
          fi

      - name: Extract this version's CHANGELOG section as the release notes
        # Slice the `## [<version>] — <date>` section out of CHANGELOG.md (up to
        # the next `## [` header) so the GitHub release body is the curated notes.
        # generate_release_notes (below) appends GitHub's auto PR list to this.
        shell: bash
        # Same discipline as the assert above: the job output reaches the script
        # through the environment, not through `${{ }}` interpolation.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ver="${VERSION}"
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            # Loudly, not quietly. This used to write a one-line body and carry
            # on, so a release cut before anyone moved `## [Unreleased]` under a
            # version heading shipped describing itself as its own name. A
            # release that cannot say what changed is not ready to publish.
            echo "CHANGELOG.md has no '## [$ver]' section." >&2
            echo "Move the '## [Unreleased]' notes under that heading and re-tag." >&2
            exit 1
          fi
          # Label plainly, every release, until a certificate exists (#282): a
          # SHA-256 or an attestation says WHICH bytes and WHICH workflow run,
          # neither says WHO signed it, and this installer has no Authenticode
          # signature (packaging/anastomosis.iss requires a SignTool define this
          # workflow does not supply). Appended after the non-empty check above
          # so a missing CHANGELOG section still fails loudly instead of
          # shipping a release note that says only this.
          {
            echo ""
            echo "---"
            echo ""
            echo "**This Windows installer is unsigned.** It carries no Authenticode signature, so Windows will not show a verified publisher. Verify it was built by this repository's release workflow instead of trusting it on sight:"
            echo ""
            echo '```'
            echo "gh attestation verify Anastomosis-Setup-${ver}.exe --repo AzalDaniel/Anastomosis"
            echo "gh attestation verify Anastomosis-${ver}-sbom.cdx.json --repo AzalDaniel/Anastomosis"
            echo "gh attestation verify Anastomosis-${ver}.msix --repo AzalDaniel/Anastomosis"
            echo '```'
            echo ""
            # Say what the .msix is before somebody double-clicks it (#292). It
            # is on this page because the Store submission is fetched from here
            # and because its provenance is attested above — not because it is a
            # download. Unsigned MSIX packages do not install.
            echo "**The \`.msix\` is a Microsoft Store submission artifact, not a download.** It is unsigned on purpose: the Store re-signs every package it ingests, which is what lets a Store install carry a trusted publisher signature. Download the \`Setup\` exe above to install Anastomosis yourself."
          } >> RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Download the built installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anastomosis-windows-installer
          path: installer

      - name: Attest build provenance (SLSA)
        # Same pattern release.yml already uses for the PyPI path (#282): proves
        # WHICH workflow run produced these exact bytes, so `gh attestation
        # verify` can check a file against this repo instead of trusting it on
        # sight. This is NOT a substitute for signing — it says nothing about
        # publisher identity, only provenance — which is why the release notes
        # below still label the installer unsigned. Runs only in this tag/publish-
        # gated job, never for the ordinary branch-push validation build above.
        #
        # The MSIX is attested alongside them (#292). It reaches the Store
        # unsigned by design and comes back re-signed by Microsoft, so between
        # this workflow and Partner Center the provenance attestation is the only
        # thing that can answer "did AzalDaniel/Anastomosis build this package?"
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            installer/*.exe
            installer/*.cdx.json
            installer/*.msix

      - name: Attach it to the release
        # Third-party action pinned to a full commit SHA (supply-chain hardening
        # for this write-scoped job); first-party actions/* stay on major tags.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # On tag runs tag_name equals the ref name (asserted above) and the tag
          # already exists, so target_commitish is unused; on dispatch runs the
          # action creates tag v<version> at target_commitish (this run's SHA).
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            installer/*.exe
            installer/*.cdx.json
            installer/*.msix
          fail_on_unmatched_files: true
          # The curated CHANGELOG section, with GitHub's auto-generated "What's
          # Changed" PR list appended after it.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Pre-1.0 versions are alphas by this project's own convention
          # (README/CHANGELOG framing, the Alpha trove classifier) — flag the
          # GitHub release accordingly instead of presenting it as stable.
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
