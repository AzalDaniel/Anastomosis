name: Windows package

# Builds the downloadable Windows installer: two Nuitka --mode=standalone exes
# (the windowed GUI app + the console CLI), each bundling Chromium + all data
# assets, packaged by Inno Setup. The frozen `anast doctor` self-check is run
# against the built CLI exe BEFORE packaging, so a mis-bundled asset or an
# un-bundled Chromium fails the build instead of shipping broken.
#
# Triggers: manual; pushes to the dev branch that touch the app/packaging (so
# pipeline changes are validated); and version tags (release builds).

on:
  workflow_dispatch:
  push:
    branches: [claude/practical-mendel-torkk3]
    paths:
      - "packaging/**"
      - ".github/workflows/windows-package.yml"
      - "src/anastomosis/**"
      - "pyproject.toml"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ms-playwright-windows-1.56.0

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[render,gui,deliver-browser]" "playwright==1.56.0" nuitka

      - name: Install Chromium (bundled at build time)
        run: playwright install chromium

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import anastomosis; print(anastomosis.__version__)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build executables (Nuitka standalone)
        run: python packaging/build_windows.py

      - name: Self-check the FROZEN bundle (anast doctor)
        # The anti-assumption gate: this exits non-zero if any data asset OR the
        # bundled Chromium is not actually present in the frozen build.
        run: dist\anast\anast.exe doctor

      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build\MicrosoftEdgeWebview2Setup.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\anastomosis.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: anastomosis-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
