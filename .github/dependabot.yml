# Dependabot version updates for Anastomosis.
#
# Two ecosystems: `github-actions` (every `uses:` pin across
# .github/workflows/*.yml — all full commit SHAs, see the pinning comments
# there) and `pip` (this package's own dependency floors, declared in
# pyproject.toml). A weekly schedule and a small PR limit keep the noise
# down; a version-update PR is reviewed like any other change here — nothing
# in this file auto-merges anything.
#
# `cooldown` is the supply-chain half of the story: a release cut yesterday
# cannot land in front of us today. GitHub ships a 3-day default cooldown as
# of mid-2026; `default-days: 7` below is a deliberate widening for a project
# whose product is medical-record handling — a compromised release should
# have a full week to be noticed and pulled before Dependabot ever proposes
# it here.
#
# Cooldown governs version updates ONLY. Dependabot security updates are a
# separate repo-settings toggle (Settings -> Code security -> Dependabot
# security updates) that reacts to a published advisory, not a schedule —
# they open immediately and are never held back by the cooldown below. A
# security fix waiting out a week-long cooldown would defeat the point of
# shipping it fast.
#
# `groups` is not a noise-reduction knob here — it exists because
# `open-pull-requests-limit` split a pair that had to move together. Two
# `uses:` pins can be two halves of one thing Dependabot tracks as unrelated
# dependencies: `github/codeql-action/init` and `.../analyze` are the init and
# analyze steps of one CodeQL release, and `actions/upload-artifact` /
# `download-artifact` are the write and read sides of one artifact format.
# The first weekly batch bumped `.../analyze` alone (PR #305) because the
# limit above was already spent on five other PRs, leaving `init` a version
# behind — a mismatch the CodeQL Action rejects outright. A single group
# covering every github-actions update turns that whole batch into one PR, so
# the limit can never again cut a version-matched pair in half; the same
# group on `pip` closes the identical gap should a future pip dependency
# split across packages that must stay in lockstep. A grouped update lands or
# fails as a unit — it cannot half-land.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Two pins carry a verification step Dependabot cannot perform, so a bump
    # it opens is incomplete by construction — and because pip updates arrive
    # as one grouped pull request, a single incomplete member holds the whole
    # batch hostage. The August 2026 group was 21 updates blocked on these two.
    #
    # Both conditions name `version-update:` types ONLY, which is the whole
    # point: routine version churn stops, and a Dependabot SECURITY update —
    # which is not a version-update type — still opens immediately. This
    # repository has no other advisory path (no pip-audit lane, no OSV scan),
    # so a blanket `dependency-name` ignore would have quietly traded a
    # published CVE in a browser-automation library for a tidier queue.
    ignore:
      # Bumping playwright means regenerating the rendering goldens in the
      # SAME change (tools/regen_goldens.py) — packaging/constraints.txt says
      # so, because one pin governs the test lanes, the goldens and the
      # Chromium bundled in the installer. Dependabot changes the pin and not
      # the goldens, which is the shape of a green PR that has already broken
      # what it was pinned to protect.
      - dependency-name: "playwright"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # pywebview 6.2.1 fails to import from a Nuitka-frozen Windows build
      # (upstream issue #1817), and the packaged GUI exe IS a Nuitka standalone
      # build — so that bump ships an installer whose app exits on launch. CI
      # cannot see it: no lane freezes the app. Every pywebview bump therefore
      # needs the packaged-installer smoke run that confirmed 6.2, which is a
      # human starting a Windows build, not a check a bot can wait on.
      - dependency-name: "pywebview"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # No ignore for hatchling, deliberately. It is not a dependency but the
      # BUILD BACKEND: `[build-system] requires` decides what produces the
      # wheel, and the core-metadata version it emits oscillates release to
      # release (1.30 and 1.32 emit 2.5, 1.31 emits 2.4), while release.yml's
      # own metadata gate admits 2.1–2.4 only — which failed a real 0.7.0
      # upload. No CI lane can see that, because the release workflow only
      # runs on a tag. Every bump therefore needs the measurement recorded in
      # pyproject.toml, which is a person reading a table.
      #
      # An ignore cannot hold that line. The scoped form (`update-types`) sat
      # here and Dependabot opened #337 and then #379 straight through it: a
      # semver level is judged against one current version, and a two-sided
      # bound names none. The bare form does fire — and silences hatchling's
      # SECURITY updates with it, which tests/unit/test_workflow_supply_chain.py
      # refuses. So the bound is guarded where it lives instead:
      # test_the_build_backend_bound_excludes_the_measured_bad_releases turns
      # every test lane red on a bump that admits a measured-bad release, and
      # that is what closed #379. The cost is a red Dependabot pull request
      # now and then, closed by hand; the alternative was an advisory nobody
      # hears.
    groups:
      pip-dependencies:
        patterns:
          - "*"
